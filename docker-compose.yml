version: '3.8'

services:
  api01:
    build: ./api
    ports:
      - "8080:3000"
    environment:
      - MESSAGE=${MESSAGE}

  api02:
    build: ./api
    ports:
      - "8081:3000"
    environment:
      - MESSAGE=${MESSAGE}

  api03:
    build: ./api
    ports:
      - "8082:3000"
    environment:
      - MESSAGE=${MESSAGE}

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: